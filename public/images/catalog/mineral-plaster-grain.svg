<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="plaster" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".19 .22" numOctaves="3" seed="17" stitchTiles="stitch" result="grain"/>
    <feDiffuseLighting in="grain" surfaceScale="2.1" diffuseConstant="1.2" lighting-color="#fff">
      <feDistantLight azimuth="225" elevation="48"/>
    </feDiffuseLighting>
  </filter>
  <rect width="360" height="360" filter="url(#plaster)"/>
</svg>
